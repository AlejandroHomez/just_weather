name: just_weather_app
description: "The best app for weather"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  geolocator: ^14.0.2
  http: ^1.6.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  rive: ^0.13.20
  animate_do: ^4.2.0

dev_dependencies:
  build_runner: ^2.4.11
  riverpod_generator: ^2.3.5
  riverpod_lint: ^2.3.5
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Merriweather
      fonts:
        - asset: assets/fonts/merriweather_regular.ttf
        - asset: assets/fonts/merriweather_italic.ttf
          style: italic
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSansSC-Bold.ttf
        - asset: assets/fonts/NotoSansSC-ExtraLight.ttf
        - asset: assets/fonts/NotoSansSC-Light.ttf

  assets:
    - .env
    - assets/
    - assets/icons/